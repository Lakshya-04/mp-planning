# Compliant (admittance) trajectory controller for the lift + arm: the same 7-joint chain and the
# same controller name (`lift_arm_controller`) as ros2_controllers.yaml, so MoveIt's controller
# config and the wall-pass demo work unchanged; only the controller type differs. Needs
# hardware:=jtac_mock (position + velocity command interfaces and the `ft_sensor` bridge).
#
# robot_description is NOT set here on purpose: the controller reads it on its own node, which a
# static YAML cannot fill with a rendered xacro. demo.launch.py injects it through the spawner's
# --param-file.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    lift_arm_controller:
      type: compliant_trajectory_controller/JtacController

lift_arm_controller:
  ros__parameters:
    joints:
      - lift_joint
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: base_footprint
      tip: tcp_link
      alpha: 0.0005

    ft_sensor:
      name: ft_sensor
      filter_coefficient: 1.0
      frame:
        id: tcp_link

    control:
      frame:
        id: tcp_link

    fixed_world_frame:
      frame:
        id: base_footprint

    gravity_compensation:
      frame:
        id: tcp_link
      CoG:
        pos: [0.0, 0.0, 0.0]
        force: 0.0

    # Starts with every axis deselected (no force obligation); a per-segment engage / disengage
    # flips these live. Diagnostic gains from the controller's own config, mass kept at the 4x
    # safety factor found necessary under a moving reference (see its comments).
    admittance:
      selected_axes: [false, false, false, false, false, false]
      mass: [16.0, 16.0, 8.0, 0.5, 0.5, 0.5]
      damping_ratio: [5.59, 5.59, 6.0, 1.0, 1.0, 1.0]
      stiffness: [1000.0, 1000.0, 300.0, 50.0, 50.0, 50.0]
      joint_damping: 5.0

    enable_parameter_update_without_reactivation: true
