# KDL works for both groups: the 6-DOF arm (analytic-friendly) and the 7-DOF lift + arm
# (redundant). Swap in pick_ik / a vendor solver per group when needed; nothing else changes.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
lift_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
