# pick_ik: a gradient-descent + evolutionary solver that starts from the seed and penalises
# displacement from it, so the solution stays on the branch the robot is on (KDL can return a far,
# wrapped solution and a caller then has to hunt for a nearby one). Works for both groups.
# Select with `ik:=pick_ik` (demo.launch.py) or build_moveit_config(..., ik='pick_ik').
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.3
  kinematics_solver_attempts: 10
  mode: global
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.01
  gd_step_size: 0.0001
lift_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.3
  kinematics_solver_attempts: 10
  mode: global
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.01
  gd_step_size: 0.0001
